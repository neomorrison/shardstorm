<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shardstorm renderer test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d18; color: #dfe6f0; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #game { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 10px; top: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(8, 10, 20, 0.72); pointer-events: none; white-space: pre; font-variant-numeric: tabular-nums; }
  #hud:empty { display: none; }
  #icons { position: absolute; inset: 0; overflow: auto; padding: 16px; display: none; background: #141925; }
  #icons h2 { font-size: 14px; margin: 14px 0 6px; color: #9fb3d1; font-weight: 600; }
  #icons .row { display: flex; flex-wrap: wrap; gap: 8px; }
  #icons figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; border-radius: 10px; background: #1d2433; }
  #icons figcaption { font-size: 10px; color: #8a96ad; }
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="hud"></div>
<div id="icons"></div>
<script type="module" src="./render-test.js"></script>
</body>
</html>
